<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">PARK HYOMIN favicon study v3</title>
  <desc id="desc">Four monochrome favicon directions without texture, glow, or accent color.</desc>
  <defs>
    <style>
      .label{font:500 22px Arial,sans-serif;letter-spacing:.16em;fill:#7f898a}
      .name{font:500 15px Arial,sans-serif;letter-spacing:.18em;fill:#dce2e1}
      .note{font:400 13px Arial,sans-serif;letter-spacing:.08em;fill:#687173}
      .tile{fill:#0b0f10;stroke:#252c2d;stroke-width:1}
      .hair{stroke:#252c2d;stroke-width:1}
    </style>

    <!-- A: flat faceted H, no glass effect -->
    <symbol id="mark-a" viewBox="0 0 64 64">
      <path fill="#e7ebea" d="M7 8 25 3v24l-7 6-11-5zM7 28l11 5 7 6v22L7 56z"/>
      <path fill="#9aa3a3" d="m39 3 18 5v20l-11 5-7-6zM39 39l7-6 11-5v28l-18 5z"/>
      <path fill="#d6dcdb" d="m18 29 14-8 14 8v8l-14 6-14-6z"/>
      <path fill="#0b0f10" d="m30 22 4-2-2 9 4 3-4 11-2-9-4-3z"/>
    </symbol>

    <!-- B: custom PHM ligature, shared strokes and sliced terminals -->
    <symbol id="mark-b" viewBox="0 0 64 64">
      <path fill="#e7ebea" fill-rule="evenodd" d="M6 58V6h20l9 8v13l-8 8H16v23H6Zm10-42v10h8l2-2v-6l-2-2h-8Z"/>
      <path fill="#b5bdbc" d="M25 58V29h10v10h9V23h9v35h-9V48h-9v10z"/>
      <path fill="#e7ebea" d="M44 58V23h8l6 10V23h6v35h-9V41l-3-5v22z"/>
      <path fill="#0b0f10" d="m31 35 4-4v12l-4 4z"/>
    </symbol>

    <!-- C: H revealed as negative space inside one crystal -->
    <symbol id="mark-c" viewBox="0 0 64 64">
      <path fill="#e7ebea" d="M32 2 57 15l-4 35-21 12L7 50l3-36z"/>
      <path fill="#9aa3a3" d="m32 2 25 13-25 12L10 14zM32 39l21 11-21 12z"/>
      <path fill="#0b0f10" d="M17 15h10v13h10V15h10v34H37V37H27v12H17z"/>
      <path fill="#0b0f10" d="m45 11 6 3-7 7zM9 43l8 6H8z"/>
    </symbol>

    <!-- D: compact PHM seal, letterforms merged into one mass -->
    <symbol id="mark-d" viewBox="0 0 64 64">
      <path fill="#e7ebea" d="M8 57V7h17l8 7v14l-7 7h-8v22zm10-40v9h5l2-2v-5l-2-2z"/>
      <path fill="#e7ebea" d="M28 57V27h9v10h8V22h9v35h-9V46h-8v11z"/>
      <path fill="#9aa3a3" d="M45 57V22h8l5 8 5-8h1v35h-8V39l-3 5-3-5v18z"/>
      <path fill="#0b0f10" d="m31 28 6-5v12l-6 5z"/>
    </symbol>
  </defs>

  <rect width="1600" height="1080" fill="#080c0d"/>
  <text x="64" y="62" class="label">FAVICON STUDY / 03</text>
  <text x="1536" y="62" class="note" text-anchor="end">NO TEXTURE · NO GLOW · NO ACCENT</text>
  <line x1="64" y1="88" x2="1536" y2="88" class="hair"/>
  <line x1="800" y1="112" x2="800" y2="1022" class="hair"/>
  <line x1="64" y1="566" x2="1536" y2="566" class="hair"/>

  <!-- A -->
  <g transform="translate(64 126)">
    <text x="0" y="20" class="label">A</text>
    <text x="54" y="20" class="name">FRACTURED H</text>
    <rect x="74" y="72" width="320" height="320" rx="42" class="tile"/>
    <use href="#mark-a" x="134" y="132" width="200" height="200"/>
    <rect x="454" y="196" width="96" height="96" rx="18" class="tile"/>
    <use href="#mark-a" x="474" y="216" width="56" height="56"/>
    <rect x="584" y="220" width="48" height="48" rx="9" class="tile"/>
    <use href="#mark-a" x="594" y="230" width="28" height="28"/>
    <text x="74" y="430" class="note">ice facets / H silhouette</text>
  </g>

  <!-- B -->
  <g transform="translate(824 126)">
    <text x="0" y="20" class="label">B</text>
    <text x="54" y="20" class="name">PHM LIGATURE</text>
    <rect x="74" y="72" width="320" height="320" rx="42" class="tile"/>
    <use href="#mark-b" x="126" y="124" width="216" height="216"/>
    <rect x="454" y="196" width="96" height="96" rx="18" class="tile"/>
    <use href="#mark-b" x="474" y="216" width="56" height="56"/>
    <rect x="584" y="220" width="48" height="48" rx="9" class="tile"/>
    <use href="#mark-b" x="594" y="230" width="28" height="28"/>
    <text x="74" y="430" class="note">shared stems / sliced terminals</text>
  </g>

  <!-- C -->
  <g transform="translate(64 600)">
    <text x="0" y="20" class="label">C</text>
    <text x="54" y="20" class="name">NEGATIVE CRYSTAL H</text>
    <rect x="74" y="72" width="320" height="320" rx="42" class="tile"/>
    <use href="#mark-c" x="134" y="132" width="200" height="200"/>
    <rect x="454" y="196" width="96" height="96" rx="18" class="tile"/>
    <use href="#mark-c" x="474" y="216" width="56" height="56"/>
    <rect x="584" y="220" width="48" height="48" rx="9" class="tile"/>
    <use href="#mark-c" x="594" y="230" width="28" height="28"/>
    <text x="74" y="430" class="note">one crystal / H cutout</text>
  </g>

  <!-- D -->
  <g transform="translate(824 600)">
    <text x="0" y="20" class="label">D</text>
    <text x="54" y="20" class="name">PHM SEAL</text>
    <rect x="74" y="72" width="320" height="320" rx="42" class="tile"/>
    <use href="#mark-d" x="126" y="124" width="216" height="216"/>
    <rect x="454" y="196" width="96" height="96" rx="18" class="tile"/>
    <use href="#mark-d" x="474" y="216" width="56" height="56"/>
    <rect x="584" y="220" width="48" height="48" rx="9" class="tile"/>
    <use href="#mark-d" x="594" y="230" width="28" height="28"/>
    <text x="74" y="430" class="note">compact initials / one mass</text>
  </g>
</svg>
